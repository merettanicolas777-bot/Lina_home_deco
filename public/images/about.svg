<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Estante con velas, difusor y objetos de cerámica">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1E6"/>
      <stop offset="1" stop-color="#E4D7C1"/>
    </linearGradient>
    <linearGradient id="cer8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFCEB4"/>
      <stop offset="0.45" stop-color="#FAF3E6"/>
      <stop offset="1" stop-color="#C7AF90"/>
    </linearGradient>
    <linearGradient id="glass8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B08F62"/>
      <stop offset="0.4" stop-color="#EFDCBB"/>
      <stop offset="1" stop-color="#9C7A4E"/>
    </linearGradient>
    <radialGradient id="glow8" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE3B9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE3B9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg8)"/>
  <path d="M110 1000 V520 A390 390 0 0 1 890 520 V1000 Z" fill="#FBF6EC" opacity="0.55"/>

  <!-- estante superior -->
  <rect x="120" y="470" width="760" height="22" rx="6" fill="#C6A987"/>
  <rect x="120" y="488" width="760" height="8" rx="4" fill="#A98C6B" opacity="0.6"/>

  <!-- cuadro -->
  <rect x="180" y="170" width="220" height="270" rx="4" fill="none" stroke="#B99C7B" stroke-width="9"/>
  <path d="M220 380 c40-70 60-120 70-160 M290 380 c20-60 40-110 60-150" stroke="#C9B393" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="330" cy="250" r="26" fill="#DCC9AE" opacity="0.8"/>

  <!-- objetos sobre estante -->
  <!-- difusor -->
  <g>
    <line x1="512" y1="420" x2="470" y2="240" stroke="#B08E62" stroke-width="5" stroke-linecap="round"/>
    <line x1="522" y1="420" x2="516" y2="228" stroke="#B08E62" stroke-width="5" stroke-linecap="round"/>
    <line x1="532" y1="420" x2="566" y2="244" stroke="#B08E62" stroke-width="5" stroke-linecap="round"/>
    <path d="M486 420 h72 a12 12 0 0 1 12 12 v22 a26 26 0 0 1-26 18 h-44 a26 26 0 0 1-26-18 v-22 a12 12 0 0 1 12-12 Z" fill="url(#cer8)"/>
    <rect x="492" y="396" width="60" height="26" rx="5" fill="#EFE6D6"/>
  </g>

  <!-- vela -->
  <g>
    <circle cx="700" cy="330" r="62" fill="url(#glow8)"/>
    <path d="M700 292 c12 18 19 27 19 38 0 13-8 22-19 22 s-19-9-19-22 c0-11 7-20 19-38 Z" fill="#EAB574"/>
    <line x1="700" y1="356" x2="700" y2="378" stroke="#8C7150" stroke-width="4" stroke-linecap="round"/>
    <path d="M652 380 h96 a8 8 0 0 1 8 8 v66 a22 22 0 0 1-22 18 h-68 a22 22 0 0 1-22-18 v-66 a8 8 0 0 1 8-8 Z" fill="url(#glass8)"/>
    <ellipse cx="700" cy="381" rx="48" ry="7" fill="#FBF2E0" opacity="0.9"/>
    <rect x="672" y="408" width="56" height="30" rx="2" fill="#F6EBD8" opacity="0.9"/>
  </g>

  <!-- jarrón pequeño -->
  <g>
    <path d="M356 424 h52 v10 c0 18 14 30 14 44 0 12-10 16-10 16 h-60 s-10-4-10-16 c0-14 14-26 14-44 Z" fill="url(#cer8)"/>
    <line x1="384" y1="422" x2="360" y2="336" stroke="#B49A78" stroke-width="3" stroke-linecap="round"/>
    <line x1="388" y1="422" x2="404" y2="342" stroke="#B49A78" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="358" cy="330" rx="9" ry="22" transform="rotate(-10 358 330)" fill="#DCCCB2"/>
    <ellipse cx="406" cy="336" rx="9" ry="21" transform="rotate(10 406 336)" fill="#DCCCB2"/>
  </g>

  <!-- estante inferior -->
  <rect x="120" y="820" width="760" height="20" rx="6" fill="#C6A987" opacity="0.9"/>
  <rect x="120" y="836" width="760" height="8" rx="4" fill="#A98C6B" opacity="0.45"/>

  <!-- bandeja inferior -->
  <ellipse cx="500" cy="800" rx="230" ry="54" fill="#B08F68" opacity="0.55"/>
  <ellipse cx="500" cy="792" rx="214" ry="46" fill="#C9AC86" opacity="0.85"/>
  <rect x="430" y="742" width="80" height="52" rx="10" fill="#F5EADA" opacity="0.9"/>
  <circle cx="566" cy="768" r="26" fill="#E3D2B8" opacity="0.9"/>

  <!-- pampas en el piso -->
  <path d="M196 900 c-10-70-4-140 14-206" stroke="#B49A78" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="212" cy="676" rx="18" ry="46" transform="rotate(14 212 676)" fill="#E4D6C0"/>
  <ellipse cx="238" cy="736" rx="14" ry="34" transform="rotate(-12 238 736)" fill="#DCCDB6"/>
</svg>
