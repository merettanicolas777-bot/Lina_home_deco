<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Bandeja oval de madera">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF6EE"/>
      <stop offset="1" stop-color="#E8DECC"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6A781"/>
      <stop offset="0.5" stop-color="#B08F68"/>
      <stop offset="1" stop-color="#997A55"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4D8C4"/>
      <stop offset="0.45" stop-color="#FBF6EB"/>
      <stop offset="1" stop-color="#D3C3AA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg6)"/>
  <circle cx="400" cy="520" r="280" fill="#FFFFFF" opacity="0.35"/>

  <!-- sombra -->
  <ellipse cx="400" cy="700" rx="300" ry="120" fill="#A98E6C" opacity="0.16"/>

  <!-- bandeja -->
  <ellipse cx="400" cy="640" rx="290" ry="130" fill="url(#wood)"/>
  <ellipse cx="400" cy="628" rx="272" ry="118" fill="#C9AC86"/>
  <ellipse cx="400" cy="632" rx="240" ry="98" fill="#B7966F"/>
  <ellipse cx="400" cy="628" rx="228" ry="90" fill="#C7A87F"/>

  <g stroke="#9B7C55" stroke-width="1.6" opacity="0.35">
    <path d="M220 604 c60-22 300-24 360 0"/>
    <path d="M214 640 c60 24 312 26 372 0"/>
    <path d="M240 668 c50 18 270 20 320 0"/>
  </g>

  <!-- vela dentro -->
  <rect x="322" y="546" width="86" height="74" rx="12" fill="url(#ceramic)"/>
  <ellipse cx="365" cy="548" rx="40" ry="8" fill="#FFFCF3"/>
  <path d="M365 500 c9 13 14 20 14 28 0 11-6 17-14 17 s-14-6-14-17 c0-8 5-15 14-28 Z" fill="#E9B673"/>
  <line x1="365" y1="540" x2="365" y2="530" stroke="#8C7150" stroke-width="3"/>

  <!-- bolita de cerámica -->
  <circle cx="470" cy="596" r="42" fill="url(#ceramic)"/>
  <path d="M440 580 c14-12 44-14 58-2" stroke="#FFFCF3" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- ramita -->
  <path d="M286 610 C266 574 262 540 276 502" fill="none" stroke="#B49A78" stroke-width="3" stroke-linecap="round"/>
  <g fill="#DCCCB2">
    <ellipse cx="272" cy="516" rx="10" ry="24" transform="rotate(-16 272 516)"/>
    <ellipse cx="288" cy="552" rx="9" ry="21" transform="rotate(18 288 552)"/>
    <ellipse cx="264" cy="572" rx="9" ry="20" transform="rotate(-22 264 572)"/>
  </g>
</svg>
